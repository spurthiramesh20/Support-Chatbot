<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>iGOT Support Hub</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f9fa; margin: 0; display: flex; justify-content: center; }
    .chat-container { width: 100%; max-width: 450px; height: 90vh; background: #fff; margin-top: 20px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .chat-header { background: #0056b3; color: white; padding: 15px; text-align: center; font-weight: bold; border-radius: 12px 12px 0 0; }
    .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .bubble { padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.5; max-width: 85%; white-space: pre-line; word-wrap: break-word; }
    .bot { background: #f0f2f5; align-self: flex-start; border-bottom-left-radius: 2px; }
    .user { background: #0056b3; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    #status { font-size: 12px; color: #666; padding: 5px 15px; font-style: italic; display: none; height: 20px; }
    .options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .opt-btn { background: #fff; border: 1px solid #0056b3; color: #0056b3; padding: 6px 12px; border-radius: 18px; cursor: pointer; font-size: 12px; transition: 0.2s; }
    .opt-btn:hover { background: #0056b3; color: white; }
    .chat-input { display: flex; padding: 12px; border-top: 1px solid #eee; }
    .chat-input input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    .chat-input button { background: #0056b3; color: white; border: none; padding: 0 15px; margin-left: 8px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">LangGraph Chatbot
  </div>
  <div id="chatBody" class="chat-body"></div>
  <div id="status">Consulting iGOT protocols...</div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const chatBody = document.getElementById("chatBody");
const userInput = document.getElementById("userInput");
const status = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");

/* --- Session Management --- */
// CRITICAL: Generates one ID per browser tab to stop the greeting loop
let threadId = localStorage.getItem("igot_thread_id");
if (!threadId) {
    threadId = "session_" + Math.random().toString(36).substring(7);
    localStorage.setItem("igot_thread_id", threadId);
}

const MENUS = {
  initial: [
    { label: "🔐 Registration", value: "menu_reg" },
    { label: "🔑 Login", value: "menu_login" },
    { label: "📚 Courses", value: "menu_course" },
    { label: "📜 Certificates", value: "menu_cert" },
    { label: "👤 Profile", value: "menu_profile" },
    { label: "📊 Dashboard/Karma", value: "menu_dash" }
  ],
  menu_reg: [
    { label: "Unable to register", value: "registration_unable_tool" },
    { label: "Email already exists", value: "registration_email_exists_tool" },
    { label: "Parichay error", value: "registration_parichay_error_tool" }
  ],
  menu_login: [
    { label: "OTP not received", value: "login_otp_not_received_tool" },
    { label: "Invalid credentials", value: "login_invalid_credentials_tool" },
    { label: "Parichay login error", value: "login_parichay_error_tool" },
    { label: "Unable to login", value: "login_unable_tool" }
  ],
  menu_course: [
    { label: "Course not visible", value: "course_not_visible_tool" },
    { label: "Progress stuck", value: "course_progress_stuck_tool" },
    { label: "Completion not updated", value: "course_completion_not_updated_tool" }
  ],
  menu_cert: [
    { label: "Not generated", value: "certificate_not_generated_tool" },
    { label: "Name incorrect", value: "certificate_name_incorrect_tool" },
    { label: "Download failed", value: "certificate_download_failed_tool" }
  ],
  menu_profile: [
    { label: "Profile not visible", value: "profile_not_visible_tool" },
    { label: "Update failed", value: "profile_update_failed_tool" },
    { label: "Verification pending", value: "profile_verification_pending_tool" },
    { label: "Multiple accounts", value: "multiple_account_issue_tool" }
  ],
  menu_dash: [
    { label: "Karma points missing", value: "dashboard_karma_points_missing_tool" },
    { label: "Data not visible", value: "dashboard_data_not_visible_tool" },
    { label: "Weekly clap missing", value: "dashboard_weekly_clap_missing_tool" },
    { label: "Stuck loading", value: "dashboard_stuck_loading_tool" }
  ]
};

function addBubble(text, type) {
  if (!text) return;
  
  // FIX: Force clean characters to replace encoding errors from tools
  const cleanText = text
    .replace(/â€¢/g, "•")
    .replace(/âœ…/g, "✅")
    .replace(/\u00E2\u20AC\u00A2/g, "•"); 
  
  const b = document.createElement("div");
  b.className = `bubble ${type}`;
  b.innerText = cleanText;
  chatBody.appendChild(b);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function renderOptions(key) {
  const opts = MENUS[key];
  if (!opts) return;
  const container = document.createElement("div");
  container.className = "options";
  opts.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerText = o.label;
    btn.onclick = () => handleFlow(o.value, o.label);
    container.appendChild(btn);
  });
  chatBody.appendChild(container);
}

async function handleFlow(val, label) {
  addBubble(label, "user");
  
  if (MENUS[val]) {
    addBubble(`Please specify the ${label.toLowerCase()} issue:`, "bot");
    renderOptions(val);
    return;
  }

  status.style.display = "block";

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
          message: val,
          thread_id: threadId // CRITICAL: Link current message to conversation history
      }) 
    });
    const data = await response.json();
    
    status.style.display = "none";
    addBubble(data.reply, "bot");
  } catch (e) {
    status.style.display = "none";
    addBubble("Protocol sync failed. Please try again.", "bot");
  }
}

sendBtn.onclick = () => {
  const text = userInput.value.trim();
  if (text) { handleFlow(text, text); userInput.value = ""; }
};

userInput.onkeydown = (e) => { if(e.key === "Enter") sendBtn.click(); };

// Start with greeting and main options
addBubble("Hi! 👋 Welcome to iGOT Support. How can I help you today?", "bot");
renderOptions("initial");
</script>
</body>
</html>
